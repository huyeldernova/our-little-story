# OPTIONAL: a throw-away MySQL 8 for people who prefer Docker.
# The project does NOT need Docker — a locally installed MySQL works the same.
# Usage: set -a; source .env; set +a; docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: our_little_story
      MYSQL_USER: ${DB_USERNAME:-ols_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ols-mysql:/var/lib/mysql
volumes:
  ols-mysql:
