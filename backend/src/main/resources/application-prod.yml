# Production (EC2 behind nginx/HTTPS). All values come from the environment;
# see docs/DEPLOYMENT.md. The app refuses to start without DB credentials.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  story:
    directory: ${OLS_STORY_DIR}
  docs:
    public-access: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
