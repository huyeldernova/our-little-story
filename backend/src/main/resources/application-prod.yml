# Production: Railway (single service, see docs/DEPLOY_RAILWAY.md) or EC2 behind nginx/HTTPS
# (docs/DEPLOYMENT.md). All values come from the environment. The app refuses to start without DB credentials.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

server:
  port: ${PORT:8080}
  # Railway / nginx terminate HTTPS and send X-Forwarded-Proto: needed for Secure cookies and same-origin checks.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

app:
  cors:
    # Single-service Railway deploy: the app's own public domain (also used for the WebSocket Origin check).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://${RAILWAY_PUBLIC_DOMAIN:localhost}}
  storage:
    local:
      directory: ${UPLOAD_DIR:/data/uploads}
  story:
    directory: ${OLS_STORY_DIR:/data/story}
    # Placeholder story baked into the Docker image, served until the private content is uploaded.
    fallback-directory: ${OLS_STORY_FALLBACK_DIR:/app/story-example}
  docs:
    public-access: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
